<div class="card shadow-sm border-0 w-75 mx-auto">
  <div class="card-body p-0">
    <div class="card-header bg-white border-bottom py-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-0 fw-semibold">User Roles</h5>
          <small class="text-muted">Manage application roles</small>
        </div>
      </div>

      <form [formGroup]="roleForm" class="row g-2 align-items-end mb-3" (ngSubmit)="isEdit ? updateRole() : addRole()">
        <input type="hidden" formControlName="id">
        <div class="col-sm-4">
          <label class="form-label mb-1">User Role</label>
          <input type="text" class="form-control" placeholder="Enter role name" formControlName="name" maxlength="100" />
        </div>
        <div class="col-sm-3 d-flex align-items-end gap-2">
          <button type="submit" class="btn btn-primary btn-sm" *ngIf="!isEdit">Add Role</button>
          <button type="submit" class="btn btn-warning btn-sm" *ngIf="isEdit">Update Role</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" (click)="resetForm()">{{ isEdit ? 'Cancel' : 'Reset' }}</button>
        </div>
      </form>
    </div>

    <div class="table-responsive" style="overflow-x:auto;">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-light sticky-top">
          <tr>
            <th style="width:60px">#</th>
            <th>User Role</th>
            <th style="width:100px">Status</th>
            <th style="width:200px" class="text-end">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let role of pagedRoles; let i = index">
            <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
            <td class="text-truncate" style="max-width:200px;" title="{{ role.name }}">{{ role.name }}</td>
            <td>
              <span class="badge" [ngClass]="role.isActive ? 'bg-success' : 'bg-secondary'">
                {{ role.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="text-end px-1 py-1">
              <div class="btn-group btn-group-sm" role="group">
                <button type="button" class="btn btn-outline-secondary" (click)="editRole(role)" title="Edit">
                  <i class="bi bi-pencil"></i>
                </button>
                <button type="button" class="btn" 
                        [ngClass]="role.isActive ? 'btn-outline-danger' : 'btn-outline-success'" 
                        (click)="toggleActive(role)"
                        title="{{ role.isActive ? 'Deactivate' : 'Activate' }}">
                  <i class="bi bi-power"></i>
                </button>
              </div>
            </td>
          </tr>

          <tr *ngIf="roles.length === 0">
            <td colspan="4" class="text-center text-muted py-4">No roles found.</td>
          </tr>
        </tbody>
      </table>

     <!-- Pagination -->
      <div class="d-flex justify-content-end p-2" *ngIf="totalPages > 1">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" type="button" (click)="changePage(currentPage - 1)">&laquo;</button>
          </li>
          <li class="page-item" *ngFor="let page of pages" [class.active]="currentPage === page">
            <button class="page-link" type="button" (click)="changePage(page)">{{ page }}</button>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button class="page-link" type="button" (click)="changePage(currentPage + 1)">&raquo;</button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
