<div class="container-fluid">
    <div class="row mb-5">
        <div class="col-12">
            <h1 class="display-5 fw-bold text-dark mb-1">
                <i class="fas fa-tachometer-alt text-primary me-3"></i>
                Dashboard Overview
            </h1>
            <p class="lead text-muted">Welcome back to ILOps Inventory System</p>
        </div>
    </div>

    <div class="row g-4">
        <!-- 1. Add Inventory -->
        <div class="col-xl-3 col-md-6">
            <div class="card card-modern h-100">
                <div class="card-body text-center p-4">
                    <i class="fas fa-warehouse fa-3x text-success mb-3"></i>  <!-- ✅ Warehouse -->
                    <h3 class="fw-bold text-success">34,560</h3>
                    <p class="text-muted mb-0"> Inventory</p>
                </div>
            </div>
        </div>

        <!-- 2. Total Items -->
        <div class="col-xl-3 col-md-6">
            <div class="card card-modern h-100">
                <div class="card-body text-center p-4">
                    <i class="fas fa-cubes fa-3x text-primary mb-3"></i>  <!-- ✅ Cubes/Items -->
                    <h3 class="fw-bold text-primary">1,245</h3>
                    <p class="text-muted mb-0">Total Items</p>
                </div>
            </div>
        </div>

        <!-- 3. Total Value (Dollar added) -->
        <div class="col-xl-3 col-md-6">
            <div class="card card-modern h-100">
                <div class="card-body text-center p-4">
                    <i class="fas fa-coins fa-3x text-warning mb-3"></i>  <!-- ✅ Coins/Money -->
                    <h3 class="fw-bold text-warning"><i class="fas fa-dollar-sign me-1"></i>12.5L</h3>
                    <p class="text-muted mb-0">Total Value</p>
                </div>
            </div>
        </div>

        <!-- 4. Users (complete 4th card) -->
        <div class="col-xl-3 col-md-6">
            <div class="card card-modern h-100">
                <div class="card-body text-center p-4">
                    <i class="fas fa-users fa-3x text-info mb-3"></i>
                    <h3 class="fw-bold text-info">89</h3>
                    <p class="text-muted mb-0">Active Users</p>
                </div>
            </div>
        </div>

        <!-- 5. Low Stock (Bonus) -->
        <div class="col-xl-3 col-md-6">
            <div class="card card-modern h-100">
                <div class="card-body text-center p-4">
                    <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                    <h3 class="fw-bold text-danger">12</h3>
                    <p class="text-muted mb-0">Low Stock</p>
                </div>
            </div>
        </div>

        <!-- 6. Orders Pending -->
        <div class="col-xl-3 col-md-6">
            <div class="card card-modern h-100">
                <div class="card-body text-center p-4">
                    <i class="fas fa-shopping-cart fa-3x text-secondary mb-3"></i>
                    <h3 class="fw-bold text-secondary">45</h3>
                    <p class="text-muted mb-0">Pending Orders</p>
                </div>
            </div>
        </div>

        <!-- 7. Revenue Today -->
        <div class="col-xl-3 col-md-6">
            <div class="card card-modern h-100">
                <div class="card-body text-center p-4">
                    <i class="fas fa-chart-line fa-3x text-info mb-3"></i>
                    <h3 class="fw-bold text-info"><i class="fas fa-dollar-sign me-1"></i>2,450</h3>
                    <p class="text-muted mb-0">Today Revenue</p>
                </div>
            </div>
        </div>

        <!-- 8. Cost Validation -->
        <div class="col-xl-3 col-md-6">
            <div class="card card-modern h-100">
                <div class="card-body text-center p-4">
                    <i class="fas fa-calculator fa-3x text-purple mb-3"></i>  <!-- Custom purple -->
                    <h3 class="fw-bold text-purple">$89K</h3>
                    <p class="text-muted mb-0">Cost Validation</p>
                </div>
            </div>
        </div>
    </div>
</div>
