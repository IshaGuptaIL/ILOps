<div class="login-wrapper">
  <div class="login-card">
    <!-- Logo + Title -->
    <div class="text-center mb-4">
      <div class="login-logo mb-3">
        <i class="fas fa-box-open fa-3x"></i>
      </div>
      <h2 class="login-title mb-1">ILOps Inventory</h2>
      <p class="text-muted login-subtitle mb-0">
        Sign in to manage inventory, sales, and reports.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email -->
      <div class="form-group mb-3">
        <label>Email address</label>
        <input type="email" formControlName="email" class="form-control" placeholder="you@company.com" />
       <span class="text-danger small" *ngIf="submitted && f.email.errors">
    <span *ngIf="f.email.errors['required']">
      Email is required
    </span>
    <span *ngIf="f.email.errors['email']">
      Enter valid email address
    </span>
  </span>
      </div>

      <!-- Password -->
      <div class="form-group mb-3">
        <label>Password</label>
        <input type="password" formControlName="password" class="form-control" placeholder="••••••••" />
       <span class="text-danger small" *ngIf="submitted && f.password.errors">
    Password is required
  </span>
      </div>

      <!-- API Error -->
      <!-- <div *ngIf="errorMessage" class="text-danger mb-3">{{ errorMessage }}</div> -->

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-login w-100">
        <i class="fas fa-sign-in-alt me-2"></i>Sign in
      </button>
    </form>

    <!-- Demo Login -->
    <div class="text-center mt-4 pt-3 border-top">
      <small class="text-muted login-footer">
        <i class="fas fa-info-circle me-1"></i>
        Demo login: <strong>abc@gmail.com</strong> / <strong>1234</strong>
      </small>
    </div>
  </div>
</div>
