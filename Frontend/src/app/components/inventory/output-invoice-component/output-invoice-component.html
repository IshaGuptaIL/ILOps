<div class="container mt-0">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 border-bottom pb-3 gap-2">
    <h2 class="fw-bold text-primary m-0"><i class="fa fa-file-export me-2"></i>Invoice Export Manager</h2>
    <div class="alert alert-info py-1 px-3 m-0 shadow-sm" *ngIf="statusMessage" style="font-size: 0.9rem;">
      <i class="fa fa-info-circle me-1"></i> {{ statusMessage }}
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-white py-3 border-bottom">
      <h5 class="m-0 fw-bold text-secondary"><i class="fas fa-tasks me-2"></i>Step 1: Get Data</h5>
    </div>
    <div class="card-body bg-light-subtle">
      <div class="row align-items-end g-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold small text-muted text-uppercase d-block text-center mb-2">1. Download</label>
          <button class="btn btn-outline-primary w-100 py-2 shadow-sm" (click)="downloadTemplate()">
            <i class="fa fa-download me-2"></i>Download Excel Template
          </button>
        </div>

        <div class="col-md-1 d-none d-md-flex justify-content-center align-items-center">
           <div class="vr h-100"></div>
        </div>

        <div class="col-md-7">
          <label class="form-label fw-semibold small text-muted text-uppercase mb-2">2. Upload Filled Template</label>
          <div class="input-group shadow-sm">
           <input 
  id="fileInput" 
  type="file" 
  #fileInput
  (change)="onFileUpload($event)" 
  accept=".xlsx,.xls" 
  class="form-control" 
/>
            <button 
              type="button" 
              class="btn btn-primary px-4" 
              (click)="uploadfile()" 
              [disabled]="!selectedFile">
              <i class="fas fa-upload me-2"></i>Upload & Sync
            </button>
          </div>
          <small class="text-muted mt-1 d-block" *ngIf="selectedFile">Selected: {{ selectedFile.name }}</small>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-4 overflow-hidden">
  <div class="card-header bg-white py-3 border-bottom">
    <h5 class="m-0 fw-bold text-secondary"><i class="fas fa-file-export me-2"></i>Step 2: Process & Download</h5>
  </div>
  <div class="card-body bg-light-subtle">
    <div class="row align-items-center g-3">
      
      <div class="col-md-7">
        <label class="form-label fw-semibold small text-muted text-uppercase d-block mb-2">Bulk Actions</label>
        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-success px-4 py-2 shadow-sm d-flex align-items-center" (click)="onOutputInvoices()">
            <i class="fas fa-file-archive me-2"></i> Generate & Download ZIP
          </button>
          
          <button class="btn btn-outline-danger px-4 py-2 shadow-sm d-flex align-items-center" (click)="onClearData()">
            <i class="fas fa-trash-alt me-2"></i> Clear List
          </button>
        </div>
      </div>

      <div class="col-md-5">
        <label class="form-label fw-semibold small text-muted text-uppercase mb-2">File Naming Prefix</label>
        <div class="input-group shadow-sm">
          <span class="input-group-text bg-white text-primary border-end-0">
            <i class="fa-solid fa-file"></i>
          </span>
          <input 
            type="text"  
              [disabled]="true"
            class="form-control border-start-0 ps-1" 
            placeholder="INV ">
        </div>
        <small class="text-muted mt-1 d-block">This will be added to the PDF filename.</small>
      </div>

    </div>
  </div>
</div>

  </div>
  <div *ngIf="invalidRows.length > 0" class="alert alert-danger mt-3">
  <h6>The following records were not found:</h6>
  <ul>
    <li *ngFor="let item of invalidRows">
      Line {{item.RowNumber}}: {{item.Value}} ({{item.Reason}})
    </li>
  </ul>
</div>
