<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-lg-10 col-xl-8">
      <div class="card border-0 shadow-lg rounded-3">
        <div class="card-header bg-primary text-white py-3 rounded-top-3">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h2 class="h4 mb-1 fw-bold">Add Inventory Item</h2>
              <p class="mb-0 opacity-90">Create new item fields.</p>
            </div>
            <span class="badge bg-light text-primary px-3 py-2 fw-semibold">Inventory</span>
          </div>
        </div>

        <div class="card-body p-4">
          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

            <!-- Warehouse -->
            <div class="mb-4">
              <label class="form-label fw-semibold">
                Warehouse <span class="text-danger">*</span>
              </label>
              <select class="form-select form-select-lg" formControlName="Whse">
                <option value="">Select Warehouse</option>
                <option *ngFor="let w of warehouses" [value]="w.whse">
                  {{ w.whse }}
                </option>
              </select>
              <div class="validation-message" *ngIf="isInvalid('Whse')">
                Warehouse required
              </div>
            </div>

            <div class="row g-4 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Part Number <span class="text-danger">*</span>
                </label>
                <input class="form-control form-control-lg"
                       formControlName="PartNo"
                       (blur)="checkPartNo()" />
                <div class="validation-message" *ngIf="isInvalid('PartNo')">
                  {{ partNoError || 'Part Number required' }}
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Product Code</label>
                <input class="form-control form-control-lg"
                       formControlName="ProductCode"
                       (input)="onProductCode()" />
              </div>
            </div>

            <div class="row g-4 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  Description (EN) <span class="text-danger">*</span>
                </label>
                <input class="form-control form-control-lg"
                       formControlName="Description" />
                <div class="validation-message" *ngIf="isInvalid('Description')">
                  Description required
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">
                  French Description <span class="text-danger">*</span>
                </label>
                <input class="form-control form-control-lg"
                       formControlName="FrDescription" />
                <div class="validation-message" *ngIf="isInvalid('FrDescription')">
                  French description required
                </div>
              </div>
            </div>

            <div class="row g-4 mb-4">
              <div class="col-md-4">
                <label class="form-label fw-semibold">
                  Type <span class="text-danger">*</span>
                </label>
                <select class="form-select form-control-lg"
                        formControlName="Type"
                        (change)="onTypeChange()">
                  <option value="">Select Type</option>
                  <option value="Hardware">Hardware</option>
                  <option value="Accessory">Accessory</option>
                </select>
                <div class="validation-message" *ngIf="isInvalid('Type')">
                  Type required
                </div>
              </div>

              <div class="col-md-8">
                <label class="form-label fw-semibold">Manufacturer</label>
                <select class="form-select form-control-lg"
                        formControlName="AccessoryGroup">
                  <option value="">-- Select Manufacturer --</option>
                  <option *ngFor="let m of filteredManufacturers"
                          [value]="m.name">
                    {{ m.name }}
                  </option>
                </select>
              </div>
            </div>

            <div class="row g-4 mb-5">
              <div class="col-md-3">
                <label class="form-label fw-semibold">Sales Dept</label>
                <input class="form-control form-control-lg"
                       formControlName="SalesDept" />
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold">
                  Cost Price <span class="text-danger">*</span>
                </label>
                <input type="number" class="form-control form-control-lg"
                       formControlName="CostPrice" />
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold">
                  Selling Price <span class="text-danger">*</span>
                </label>
                <input type="number" class="form-control form-control-lg"
                       formControlName="SellingPrice" />
              </div>
            </div>

            <div class="d-flex gap-3 justify-content-end">
              <button type="submit"
                      class="btn btn-primary btn-lg px-5"
                      [disabled]="form.invalid || submitting">
                <i class="fas fa-plus-circle me-2"></i>
                {{ submitting ? 'Saving...' : 'Add Item' }}
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
