<div class="ms-access-form">
  <div class="form-titlebar">
    <span>IMEI Reports & Spire Stock Status</span>
    <button class="win-btn win-close">×</button>
  </div>

  <div class="form-body">
    <!-- Header Controls -->
    <div class="action-panel">
      <span class="panel-desc">Manage and track IMEI stock & generate inventory reports</span>
      <button class="ms-btn ms-btn-primary" (click)="spireStockStatus()">Spire Stock Status</button>
    </div>

    <!-- Spire Receipts Filter -->
    <div class="filter-box">
      <div class="box-title">Spire Receipts Filter</div>
      <div class="filter-row">
        <div class="filter-group">
          <label>Start Date:</label>
          <input type="date" [(ngModel)]="receiptStartDate" [max]="today" class="ms-input" />
        </div>
        <div class="filter-group">
          <label>End Date:</label>
          <input type="date" [(ngModel)]="receiptEndDate" [max]="today" class="ms-input" />
        </div>
        <div class="filter-group-btn">
          <button class="ms-btn" (click)="generateReceiptsReport()">Generate Spire Receipts</button>
        </div>
      </div>
    </div>

    <!-- IMEI Filters Grid -->
    <div class="filter-box">
      <div class="box-title">IMEI Inventory Filters</div>
      <div class="filter-grid">
        <div class="filter-group">
          <label>Item Type:</label>
          <select [(ngModel)]="combo8" (change)="combo8Changed()" class="ms-select">
            <option value="">Select Type</option>
            <option value="Hardware">Hardware</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Vendor:</label>
          <select [(ngModel)]="vendor" class="ms-select">
            <option value="">All Vendors</option>
            <option *ngFor="let v of vendors" [value]="v.id">{{ v.name }}</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Part Number:</label>
          <select [(ngModel)]="part" class="ms-select">
            <option [ngValue]="null">All Parts</option>
            <option *ngFor="let p of parts" [ngValue]="p">{{ p }}</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Start Date:</label>
          <input type="date" [(ngModel)]="imeiStartDate" [max]="today" class="ms-input" />
        </div>

        <div class="filter-group">
          <label>End Date:</label>
          <input type="date" [(ngModel)]="imeiEndDate" [max]="today" class="ms-input" />
        </div>
      </div>
      <div class="button-row-right">
        <button class="ms-btn ms-btn-primary" (click)="spireReceivedReport()">Download Received Report</button>
      </div>
    </div>

    <!-- Receipt & PO Search -->
    <div class="filter-box">
      <div class="box-title">Direct Receipt / PO Lookup</div>
      <div class="filter-row">
        <div class="filter-group">
          <label>Receipt Number:</label>
          <input id="receiptNo" [(ngModel)]="receiptNo" class="ms-input" placeholder="Enter Receipt No..." />
        </div>
        <div class="filter-group">
          <label>PO Number:</label>
          <input id="poNumber" [(ngModel)]="poNumber" class="ms-input" placeholder="Enter PO Number..." />
        </div>
        <div class="filter-group-btn">
          <button class="ms-btn" (click)="searchReceipts()">Search</button>
        </div>
      </div>
    </div>
  </div>
</div>
