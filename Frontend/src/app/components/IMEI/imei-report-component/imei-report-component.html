  <div class="report-container">



  <!-- IMEI Report Header -->
<div class="report-header">
  <div class="header-left">
    <h2 class="title">IMEI Report</h2>
    <p class="subtitle">Manage and track IMEI stock & reports</p>
  </div>

  <div class="header-right">
    <button class="btn-primary" (click)="spireStockStatus()">
      📦 Spire Stock Status
    </button>
  </div>
</div>
   

    <!-- Spire Receipts Filter -->
   <div class="field-inline">
  <div class="field-inline-item">
    <label>Start Date:</label>
    <input type="date" [(ngModel)]="receiptStartDate" [max]="today">
  </div>

  <div class="field-inline-item">
    <label>End Date:</label>
    <input type="date" [(ngModel)]="receiptEndDate" [max]="today">
  </div>

  <div class="field-inline-item">
    
    <button class="btn-primary" (click)="generateReceiptsReport()">Spire Receipts</button>
  </div>
</div>
     
    <hr>

    <!-- IMEI Filters Grid -->
    <div class="grid">
      <div class="field">
        <label>Item Type</label>
        <select [(ngModel)]="combo8" (change)="combo8Changed()">
          <option value="">Select Type</option>
          <option value="Hardware">Hardware</option>
        </select>
      </div>

      <div class="field">
        <label>Vendor</label>
        <select [(ngModel)]="vendor">
          <option value="">All Vendors</option>
          <option *ngFor="let v of vendors" [value]="v.id">{{ v.name }}</option>
        </select>
      </div>

      <div class="field">
        <label>Part</label>
        <select [(ngModel)]="part">
          <option [ngValue]="null">All Parts</option>
          <option *ngFor="let p of parts" [ngValue]="p">{{ p }}</option>
        </select>
      </div>

      <div class="field">
        <label>Start Date</label>
        <input type="date" [(ngModel)]="imeiStartDate" [max]="today">
      </div>

      <div class="field">
        <label>End Date</label>
        <input type="date" [(ngModel)]="imeiEndDate" [max]="today">
      </div>
    </div>
 <div class="actions">
    <button class="btn-primary" (click)="spireReceivedReport()">
      Download Received Report
    </button>
  </div>
  <hr>

  <!-- Receipt & PO Search -->
  <div class="grid grid-2">
    <div class="field">
      <label for="receiptNo">Receipt Number:</label>
      <input id="receiptNo" [(ngModel)]="receiptNo" class="form-control" placeholder="Enter Receipt No">
    </div>

    <div class="field">
      <label for="poNumber">PO Number:</label>
      <input id="poNumber" [(ngModel)]="poNumber" class="form-control" placeholder="Enter PO Number">
    </div>

    <div class="field-full">
      <button (click)="searchReceipts()" class="btn btn-primary mt-2">Search</button>
    </div>
  </div>
  </div>
