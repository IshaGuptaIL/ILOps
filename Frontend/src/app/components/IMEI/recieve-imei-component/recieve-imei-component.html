<div class="ms-access-form">
  <div class="form-titlebar">
    <span>Receive IMEI's (Alternative / Legacy DAL)</span>
    <button class="win-btn win-close">×</button>
  </div>

  <div class="form-body">
    <!-- PO Selection -->
    <div class="panel-box">
      <div class="panel-title">Purchase Order Selection</div>
      <div class="form-row">
        <div class="field-group wide">
          <label>Select PO:</label>
          <select class="ms-select-wide" [(ngModel)]="selectedPONumber" (ngModelChange)="onPOChange($event)">
            <option value="">-- Select PO --</option>
            <option *ngFor="let po of poList" [value]="po.poNumber">
              {{ po.poNumber }} | {{ po.whse }} | {{ po.part }} | ORD:{{ po.ordQty }}
            </option>
          </select>
        </div>
        <div class="field-group"><label>Warehouse:</label><input class="ms-input-small" [value]="selectedPO?.whse" readonly /></div>
        <div class="field-group"><label>Part No:</label><input class="ms-input" [value]="selectedPO?.part" readonly /></div>
        <div class="field-group"><label>Ordered Qty:</label><input class="ms-input-tiny" [value]="selectedPO?.ordQty" readonly /></div>
        <div class="field-group"><label>Received Qty:</label><input class="ms-input-tiny" value="0" readonly /></div>
        <div class="field-group"><label>Errors:</label><input class="ms-input-tiny" [value]="errorCount" readonly /></div>
      </div>
    </div>

    <!-- File Upload -->
    <div class="panel-box">
      <div class="panel-title">Data Import & Mode</div>
      <div class="upload-row">
        <div class="upload-box">
          <label>Scan File (XLSX):</label>
          <input type="file" (change)="onFileChange($event)" accept=".xlsx" class="ms-file-input" />
          <button class="ms-btn mt-1" (click)="importScanList()">Import Scan List</button>
        </div>
        <div class="upload-box">
          <label>Packing Slip (XLSX):</label>
          <input type="file" (change)="onPackingSlipFileSelected($event)" accept=".xlsx" class="ms-file-input" />
          <button class="ms-btn mt-1" (click)="importPackingSlip()">Import Packing Slip</button>
        </div>
        <div class="mode-box">
          <label>Mode:</label>
          <div class="radio-group">
            <label><input type="radio" name="mode" [(ngModel)]="modeReversal" [value]="false" (change)="onModeChange()" /> Receipt</label>
            <label><input type="radio" name="mode" [(ngModel)]="modeReversal" [value]="true" (change)="onModeChange()" /> Reversal</label>
          </div>
          <button class="ms-btn ms-btn-warn mt-2" (click)="checkErrors()" [disabled]="!selectedPO">Check Errors</button>
        </div>
      </div>

      <div *ngIf="checkedOnce" class="mt-2">
        <div *ngIf="errorCount > 0" class="error-summary">
          <div class="summary-title">⚠ Errors Found:</div>
          <div *ngFor="let err of errors">{{ err }}</div>
        </div>
        <div *ngIf="errorCount === 0" class="success-summary">
          <div class="summary-title">✓ No errors found. Ready to post.</div>
        </div>
      </div>
    </div>

    <!-- Grids -->
    <div class="panel-box">
      <div class="panel-title">Verification Lists</div>
      <div class="grids-container">
        <div *ngFor="let grid of [{title:'Scan List', data:scanList},{title:'Packing Slip', data:packingSlip},{title:'Matches', data:matches},{title:'Scan-NoPackSlip', data:scanNoPack},{title:'PackSlip-NoScan', data:packNoScan},{title:'Onhand', data:onhand}]" class="grid-column">
          <div class="grid-header">{{ grid.title }}</div>
          <div class="grid-table">
            <div *ngFor="let item of grid.data" class="grid-row">{{ item.imei }}</div>
          </div>
          <div class="grid-stats">Count: {{ grid.data.length }}</div>
        </div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="panel-box">
      <div class="footer-row">
        <div class="field-group"><label>Unit Cost:</label><input class="ms-input" type="number" [(ngModel)]="unitCost" (input)="onUnitCostChange()" /></div>
        <div class="field-group"><label>HPC Cost:</label><input class="ms-input" [value]="hpcCost" readonly /></div>
        <div class="field-group"><label>CMO Number:</label><input class="ms-input" [(ngModel)]="cmoNumber" placeholder="Enter CMO..." /></div>
        <div class="post-group">
          <button class="ms-btn ms-btn-primary" (click)="postReceipts()" [disabled]="!canPost || !cmoNumber">
            {{ modeReversal ? 'Post Reversal' : 'Post Receipts' }}
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
