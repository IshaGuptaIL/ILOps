<div class="imei-wrapper">
    <div class="imei-card">
        <div class="imei-title">IMEI Receive</div>

        <div class="imei-menu">
            <button (click)="navigate('receive-imei')">
                Receive IMEI's <span>➜</span>
            </button>

            <button (click)="navigate('invoice-credit')">
                Enter Invoice / Credits <span>➜</span>
            </button>

            <button (click)="navigate('reports')">
                Reports <span>➜</span>
            </button>

            <button (click)="navigate('find-imei')">
                Find By IMEI <span>➜</span>
            </button>

            <button (click)="navigate('reverse-receipt')">
                Reverse Receipt <span>➜</span>
            </button>

            <button (click)="navigate('imei-exceptions')">
                IMEI Exceptions <span>➜</span>
            </button>

            <button class="exit-btn" (click)="navigate('exit')">
                Exit IMEI Receive <span>➜</span>
            </button>
        </div>
    </div>
</div>
