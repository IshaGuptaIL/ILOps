<div class="ms-access-mdi">
  <!-- Shared Global Spinner -->
  <app-spinner></app-spinner>

  <!-- MDI Title Bar -->
  <div class="mdi-titlebar">
    <span class="mdi-title">Microsoft Access - [RMA Reporting Module: RMAReporting-Spire]</span>
    <div class="mdi-window-controls">
      <button class="win-btn">_</button>
      <button class="win-btn">□</button>
      <button class="win-btn win-close" (click)="navigate('exit')">×</button>
    </div>
  </div>

  <!-- MDI Toolbar / Buttons for All Submodules -->
  <div class="mdi-toolbar">
    <div class="toolbar-group">
      <button class="ms-btn" [class.btn-active]="activeScreen === 'rogersReportImport'" (click)="navigate('rogersReportImport')">
        Import Rogers CM and RMA data.
      </button>
      <button class="ms-btn" [class.btn-active]="activeScreen === 'reports2'" (click)="navigate('reports2')">
        Reports
      </button>
      <button class="ms-btn" [class.btn-active]="activeScreen === 'utilities'" (click)="navigate('utilities')">
        Utilities
      </button>
      <button class="ms-btn" [class.btn-active]="activeScreen === 'imeiSearch'" (click)="navigate('imeiSearch')">
        IMEI Search
      </button>
      <button class="ms-btn" (click)="navigate('previous')">
        Previous Menu
      </button>
    </div>
    <div class="toolbar-group">
      <button class="ms-btn ms-exit" (click)="navigate('exit')">Exit Application</button>
    </div>
  </div>

  <!-- MDI Workspace Area -->
  <div class="mdi-workspace">
    
    <!-- 1. IMEI SEARCH SCREEN -->
    <app-imei-search *ngIf="activeScreen === 'imeiSearch'"></app-imei-search>

    <!-- 2. ROGERS REPORT IMPORT SCREEN -->
    <app-rogers-report-import *ngIf="activeScreen === 'rogersReportImport'"></app-rogers-report-import>

    <!-- 3. REPORTS SCREEN (frmReports2) -->
    <app-rma-reports *ngIf="activeScreen === 'reports2'"></app-rma-reports>

    <!-- 4. UTILITIES SCREEN (frmUtility / frmUsers / Switchboard) -->
    <app-rma-utilities *ngIf="activeScreen === 'utilities'" (navigateTab)="navigate($event)"></app-rma-utilities>

  </div>
</div>
