
<h2>Customer Sales</h2>

<div class="form-container">
    <!-- Row 1: Group Selection and Management -->
    <div class="row align-items-center mb-4">
        <div class="col-auto">
            <div class="form-group mb-0">
                <label>Cust Group:</label>
                <select class="form-select" [(ngModel)]="selectedGroup" (change)="onGroupChange()">
                    <option value="" disabled selected>Cust Group, Customer Name, BVCustCount</option>
                    <option *ngFor="let g of customerGroups" [value]="g.custGroup">
                        {{ g.custGroup }} - {{ g.groupName }} - {{ g.bvCustCount }}
                    </option>
                </select>
            </div>
        </div>
        <div class="col-auto">
            <button class="btn-access" (click)="viewFields()">View Fields</button>
        </div>
        <div class="col-auto">
            <button class="btn-access" (click)="newCustomerGroup()">New Customer Group</button>
        </div>
        <div class="col-auto">
            <button class="btn-access" (click)="deleteCustomerGroup()">Delete Customer Group</button>
        </div>
    </div>

    <!-- Row 2: Customer List and Main Parameters -->
    <div class="row mb-4">
        <!-- Left: Customer List Box -->
        <div class="col-md-5">
            <div class="customer-list-box">
                <div class="d-flex justify-content-between align-items-center p-2 bg-light border-bottom">
                    <strong>Customers in Group</strong>
                    <button class="btn btn-sm btn-success" (click)="startAddCustomer()" [disabled]="!selectedGroup">
                        <i class="bi bi-plus-lg"></i> Add
                    </button>
                </div>
                <table class="table-access mb-0">
                    <thead class="sticky-top">
                        <tr>
                            <th>Cust No</th>
                            <th>Customer Name</th>
                            <th style="width: 80px;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Add New Row -->
                        <tr *ngIf="editingCustNo === 'NEW'">
                            <td><input type="text" class="form-control form-control-sm" [(ngModel)]="newCustomer.bvCustNo"></td>
                            <td><input type="text" class="form-control form-control-sm" [(ngModel)]="newCustomer.bvName"></td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <button class="btn btn-primary" (click)="saveCustomer()"><i class="bi bi-check-lg"></i></button>
                                    <button class="btn btn-secondary" (click)="cancelCustomerEdit()"><i class="bi bi-x-lg"></i></button>
                                </div>
                            </td>
                        </tr>

                        <!-- Existing Rows -->
                        <tr *ngFor="let c of customersInGroup">
                            <ng-container *ngIf="editingCustNo !== c.bvCustNo">
                                <td>{{ c.bvCustNo }}</td>
                                <td>{{ c.bvName }}</td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <button class="btn btn-outline-primary border-0" (click)="editCustomer(c)">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button class="btn btn-outline-danger border-0" (click)="deleteCustomer(c)">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>
                            <ng-container *ngIf="editingCustNo === c.bvCustNo">
                                <td><input type="text" class="form-control form-control-sm" [(ngModel)]="newCustomer.bvCustNo"></td>
                                <td><input type="text" class="form-control form-control-sm" [(ngModel)]="newCustomer.bvName"></td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <button class="btn btn-primary" (click)="saveCustomer()"><i class="bi bi-check-lg"></i></button>
                                        <button class="btn btn-secondary" (click)="cancelCustomerEdit()"><i class="bi bi-x-lg"></i></button>
                                    </div>
                                </td>
                            </ng-container>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right: Date Filters and Format -->
        <div class="col-md-7">
            <div class="ps-md-5">
                <div class="form-group">
                    <label>Start Date:</label>
                    <input type="date" class="form-control" [(ngModel)]="startDate">
                </div>
                <div class="form-group">
                    <label>End Date:</label>
                    <input type="date" class="form-control" [(ngModel)]="endDate">
                </div>

                <div class="frame-access my-4" style="width: 100px;">
                    <span class="frame-label">Format:</span>
                    <div class="form-check small">
                        <input class="form-check-input" type="radio" name="fmt" id="fmt1" value="Excel"
                            [(ngModel)]="selectedFormat">
                        <label class="form-check-label" for="fmt1">Excel</label>
                    </div>
                    <div class="form-check small">
                        <input class="form-check-input" type="radio" name="fmt" id="fmt2" value="CSV"
                            [(ngModel)]="selectedFormat">
                        <label class="form-check-label" for="fmt2">CSV</label>
                    </div>
                </div>

                <div class="mt-4">
                    <button class="btn-access btn-large" (click)="generateData()">Generate Data</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Row 3 & 4: MSD and Territory Tools -->
    <div class="row mb-3">
        <div class="col-md-5">
            <div class="form-group">
                <label>MSD Code:</label>
                <input type="text" class="form-control" [(ngModel)]="msdCodeInput" style="width: 100px;">
                <button class="btn-access btn-wide ms-2" (click)="generateByMSDInput()">
                    Re-Generate Customer Group By MSD
                </button>
            </div>
            <div class="form-group">
                <label>Territory:</label>
                <input type="text" class="form-control" [(ngModel)]="territoryInput" style="width: 100px;">
                <button class="btn-access btn-wide ms-2" (click)="generateByTerritory()">
                    Re-Generate Customer Group by Customer Profile Territory
                </button>
            </div>
            <div class="ps-5 ms-4 mt-2">
                <button class="btn-access btn-wide" (click)="addFDDealerGroup()">
                    Add all customers with Territory beginning with FD to FDDealer Group
                </button>
            </div>
        </div>

        <!-- Right: Action Buttons Cluster -->
        <div class="col-md-7">
            <div class="ps-md-5">
                <div class="mb-2">
                    <button [class.btn-active]="isEditing" class="btn-access btn-large" (click)="editData()">
                        {{ isEditing ? 'Save Data' : 'Edit Data' }}
                    </button>
                </div>
                <div class="mb-2">
                    <button class="btn-access btn-large" (click)="exportExcel()">Output Edited Data</button>
                </div>
                <div class="mb-3">
                    <button class="btn-access btn-large" (click)="outputPerCustomer()">Output Edited Data Per
                        Customer</button>
                </div>
                <div class="d-flex gap-3">
                    <button class="btn-access btn-large" (click)="sunLifeXLS()">Sun Life XLS</button>
                    <button class="btn-access btn-large" (click)="splitPayment()">Split payment</button>
                </div>
            </div>
        </div>
    </div>


</div>

<app-field-selector-modal *ngIf="showFieldSelector" [customerGroup]="selectedGroup" [fields]="selectedFields"
    [onClose]="closeFieldSelector">
</app-field-selector-modal>

<app-new-customer-group-modal *ngIf="showNewGroupModal" (onSaved)="onGroupCreated()"
    (onClose)="closeNewGroupModal()"></app-new-customer-group-modal>

<app-edit-data-modal *ngIf="showEditModal" [data]="reportData" [fields]="selectedFields" (onSave)="saveEditedData()"
    (onClose)="closeEditModal()">
</app-edit-data-modal>
